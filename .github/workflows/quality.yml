name: Release quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: palonex
          POSTGRES_DB: palonex_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palonex -d palonex_ci"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://palonex@127.0.0.1:5432/palonex_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test:unit
      - name: Build without runtime secrets
        run: npm run build
      - name: Apply and verify migrations
        env:
          DATABASE_URL_UNPOOLED: postgresql://palonex@127.0.0.1:5432/palonex_ci
        run: npm run db:migrate && npm run db:status
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Browser checks with generated test secrets
        run: |
          export DATABASE_URL="$TEST_DATABASE_URL" APP_ORIGIN=http://127.0.0.1:3100
          export ENQUIRY_SIGNING_SECRET="$(openssl rand -hex 32)"
          export PUBLIC_AUTH_SECRET="$(openssl rand -hex 32)" BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          export CRON_SECRET="$(openssl rand -hex 32)" MAIL_WORKERS_ENABLED=false
          npm test -- --workers=2
